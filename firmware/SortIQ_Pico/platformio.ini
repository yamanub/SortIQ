; Versions are PINNED to the bench-validated stack (2026-08). This firmware's
; behavior is verified to ustep-level timing against exactly these sources —
; upgrade a pin only deliberately, with the bench available, never as a side
; effect of a package refresh. Note: refreshing packages regenerates
; .pio/libdeps and DROPS the local FastAccelStepper claimed_pios patch
; (see README) — re-apply it after any refresh.
[env:skr_pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#9c167c6
board = rpipico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
monitor_speed = 9600
lib_deps =
	teemuatlut/TMCStepper@0.7.3
	gin66/FastAccelStepper@0.31.8
	adafruit/Adafruit NeoPixel@1.15.5
build_flags = -Wall -D__FREERTOS=1
