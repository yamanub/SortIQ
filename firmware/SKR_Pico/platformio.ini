; SortIQ sorter firmware for the BigTreeTech SKR Pico (RP2040, 4x onboard
; TMC2209). Port of the CS7.2 SortIQ fork — same serial protocol, so the
; SortIQ app sees a fork board.
;
;   build:  pio run
;   flash:  hold BOOT on the Pico, plug USB-C into any PC, release BOOT —
;           it mounts as RPI-RP2; copy .pio/build/skr_pico/firmware.uf2 onto it.
;           (or: pio run -t upload with the board in BOOT mode)
;
; The Pi link is the board's "Raspberry Pi" UART header (Serial1, 9600 baud
; like the stock firmware); USB-C (Serial) mirrors the same protocol for
; bench work from a PC.

[env:skr_pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico                     ; same RP2040 + 2MB flash + 12MHz crystal as the SKR Pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
monitor_speed = 9600
lib_deps =
    teemuatlut/TMCStepper@^0.7.3
    adafruit/Adafruit NeoPixel@^1.12.3
build_flags =
    -DSKR_PICO
    -Wall
