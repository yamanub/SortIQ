[project]
name = "sortiq"
version = "1.6.0"
requires-python = "==3.12.*"   # TensorFlow wheels lag new Pythons; keep pinned
dependencies = [
    "tensorflow>=2.16",
    "opencv-python",
    "numpy",
    "pyserial",
    "flask",
]

[tool.uv]
package = false   # not a distributable package — scripts run straight from the tree
